# Publish workflow for GitHub actions

name: Publish package

on:
    workflow_run:
        workflows: ["Build & test"]
        branches: [ "main" ]
        types:
        - completed

jobs:
    publish:

        # Only publish when the build & test run succeeded.
        if: github.event.workflow_run.conclusion == 'success'

        runs-on: ubuntu-latest

        # Required for NuGet Trusted Publishing: lets the job request a GitHub OIDC token.
        permissions:
            id-token: write
            contents: read

        steps:
        - uses: actions/checkout@v4
  
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'

        # PackageId and Description are defined per project; packs AcumenRx, AcumenRx.Xunit and AcumenRx.Xunit.v3.
        - name: Pack
          run: dotnet pack -p:Authors="${{ vars.NUGETPACKAUTHORS }}" -p:Copyright="${{ vars.NUGETPACKCOPYRIGHT }}" -p:PackageProjectUrl="${{ vars.NUGETPACKPROJECTURL }}" -c Release -o artifacts src/Acumen.sln

        # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key.
        - name: NuGet login
          uses: NuGet/login@v1
          id: nuget-login
          with:
            user: ${{ vars.NUGETUSER }}

        - name: Push
          run: dotnet nuget push "artifacts/*.nupkg" -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s ${{ vars.NUGETPUSHSOURCE }} --skip-duplicate
