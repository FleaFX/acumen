# Build workflow for GitHub actions

name: Build & test

on:
    push:
        branches: [ "main" ]
    pull_request:
        branches: [ "main" ]

jobs:
    build:
    
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4
  
        - name: Setup .NET
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: '8.0.x'

        - name: Restore packages
          run: dotnet restore src/Acumen.sln

        - name: Build
          run: dotnet build --no-restore -c Release src/Acumen.sln
          
        # Runs both the xUnit v2 (Acumen.Xunit.Tests) and the xUnit v3 (Acumen.Xunit.v3.Tests) test projects.
        - name: Test
          run: dotnet test --no-build -c Release --verbosity normal src/Acumen.sln

        # Packs AcumenRx, AcumenRx.Xunit and AcumenRx.Xunit.v3 to verify packaging.
        - name: Pack
          run: dotnet pack --no-build -c Release -o artifacts src/Acumen.sln
